id: container-platform-escape
title: Container platform escape
stride: elevation-of-privilege
cwe: 653
capec: [CAPEC-233]
asvs: V14.1.3
cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Kubernetes_Security_Cheat_Sheet.html
function: operations

description: >
  The container platform does not record that it has been hardened. Container isolation
  is a configuration, not a property: a privileged pod, a mounted socket or a
  host-network workload turns one compromised container into the node and then the
  cluster.

detection_logic: >
  An element whose technology is a container platform that does not record the hardened
  control. The subject is the platform rather than the workloads, because the settings
  that make escape possible — admission policy, seccomp and AppArmor profiles, RBAC on
  the control plane — belong to the platform.

risk_assessment: >
  Impact is Very High: escaping to the node reaches every workload's secrets, and from
  the node the control plane is usually one over-scoped service account away.
  Likelihood is Likely when anything on the platform is reachable from the internet.

false_positives: >
  Managed control planes where the provider owns the node configuration and enforces
  admission policy, and clusters governed by a policy engine whose reports nobody has
  copied into the model. Record hardened with a pointer to the policy set.

mitigation: >
  Enforce a restricted pod security standard by admission rather than by convention,
  deny privileged containers, host networking and host path mounts, give each workload
  its own service account with no cluster-wide verbs, and keep node access off the
  general network.
action: Enforce a restricted admission policy and remove privileged workloads.
check: Attempt to schedule a privileged pod with a host path mount and confirm admission rejects it.

scope: element
match: |
  el.technology.container_platform
  && !el.controls.hardened

likelihood: |
  el.internet_reachable ? 'likely' : 'unlikely'
impact: very-high

data_breach_probability: probable
risk_title: "{{ el.name }} has no recorded hardening against container escape"
tags: [container, hardening, isolation]
