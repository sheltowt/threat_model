id: accidental-secret-leak
title: Secrets in a source repository or artefact registry
stride: information-disclosure
cwe: 540
capec: [CAPEC-545]
asvs: V6.4.1
cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html
function: development

description: >
  A credential lives in the source repository or the artefact registry. Both keep
  history, both are copied widely by design, and a secret that reaches either is best
  treated as already public.

detection_logic: >
  An in-scope element whose technology is a source code repository or an artefact
  registry, which processes or stores a data asset flagged as credentials. Either
  relationship counts: a secret baked into an image is stored in the registry just as
  surely as one committed to a file is stored in the repository.

risk_assessment: >
  Impact is Very High because the exposure is not scoped to whoever is attacking today
  — every clone, every fork, every cached layer carries it, and rotation is the only
  remedy. Likelihood is Very Likely once the holder is reachable from the internet.

false_positives: >
  Encrypted secrets committed deliberately — a sealed-secrets or SOPS file whose
  ciphertext is useless without a key held elsewhere — and test fixtures modelled as
  credentials that unlock nothing. Model the ciphertext as a distinct data asset that
  is not flagged as credentials.

mitigation: >
  Move the secret into a vault referenced at runtime, then rotate it: removing the
  commit does not remove it from history, from forks or from anyone's clone. Add a
  pre-receive secret scanner so the next one is caught before it lands.
action: Rotate the exposed credential and replace it with a runtime vault lookup.
check: Scan the full repository history and every published image layer for the value and confirm the rotated one appears nowhere.

scope: element
match: |
  (el.technology.sourcecode_repository || el.technology.artifact_registry)
  && el.handles.exists(d, d.credentials)

likelihood: |
  el.internet_reachable ? 'very-likely' : 'likely'
impact: very-high

data_breach_probability: probable
risk_title: "{{ el.name }} holds credential material"
tags: [secrets, supply-chain]
