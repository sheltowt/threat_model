schema: tmac/1.0

meta:
  title: Payment Service
  description: Card-present checkout API for the storefront, plus its settlement batch.
  owner: platform-security
  author: B. Shelton
  date: 2026-09-06
  version: 3
  business_criticality: critical
  management_summary: >
    The payment service accepts card data from the storefront, tokenises it through
    the processor, and stores only tokens. The open questions are whether the
    settlement batch needs the full pan and who owns key rotation.
  questions:
    Does the settlement batch require the full pan, or will a token do?: null
    Who rotates the processor API credentials, and how often?: Platform team, quarterly.
  abuse_cases:
    Carding: An attacker uses the checkout endpoint to test stolen card numbers in bulk.
    Insider export: An operator with database access exports the token vault.
  security_requirements:
    PCI DSS 3.4: Primary account numbers are never written to durable storage.
    Least privilege: Every service account holds only the grants its job needs.

data_assets:
  card_data:
    description: Primary account number and expiry, in flight only.
    classification: strictly-confidential
    integrity: critical
    availability: important
    quantity: many
    pii: true
    regulations: [pci-dss]
    owner: payments
    justification: A pan is the archetypal regulated identifier.

  payment_token:
    description: Processor-issued token standing in for a card.
    classification: confidential
    integrity: critical
    availability: critical
    quantity: very-many
    owner: payments

  customer_profile:
    description: Name, billing address and contact details.
    classification: restricted
    integrity: important
    availability: important
    quantity: many
    pii: true
    regulations: [gdpr]

  processor_credentials:
    description: API key and signing secret for the payment processor.
    classification: strictly-confidential
    integrity: mission-critical
    availability: critical
    quantity: very-few
    credentials: true

  audit_log:
    description: Append-only record of payment state changes.
    classification: internal
    integrity: critical
    availability: important
    quantity: very-many
    usage: devops

elements:
  shopper:
    name: Shopper
    kind: actor
    technology: browser
    human: true
    internet_facing: true

  storefront:
    name: Storefront web app
    technology: web-application
    size: application
    machine: container
    internet_facing: true
    custom_code: true
    processes: [card_data, customer_profile]
    accepts_formats: [json, html]
    controls:
      validates_input: true
      encodes_output: true
      uses_content_security_policy: false
      implements_csrf_token: true
      uses_strong_session_ids: true

  payment_api:
    name: Payment API
    technology: web-service-rest
    size: service
    machine: container
    custom_code: true
    multi_tenant: true
    processes: [card_data, payment_token, customer_profile, processor_credentials]
    accepts_formats: [json]
    controls:
      validates_input: true
      validates_schema: true
      uses_parameterized_queries: true
      has_access_control: true
      logs_security_events: true
      rate_limited: false

  token_store:
    name: Token store
    technology: database
    size: service
    machine: virtual
    encryption: transparent
    stores: [payment_token, customer_profile]
    controls:
      has_access_control: true

  audit_store:
    name: Audit log store
    technology: database
    size: service
    machine: virtual
    stores: [audit_log]
    usage: devops
    controls:
      has_access_control: true

  settlement_batch:
    name: Nightly settlement batch
    technology: batch-processing
    size: application
    machine: virtual
    custom_code: true
    processes: [payment_token, audit_log]

  processor:
    name: Card processor
    kind: external
    technology: web-service-rest
    out_of_scope: true
    justification_out_of_scope: >
      Operated by the processor under its own PCI attestation; we model the link but
      not the far side.
    processes: [card_data, payment_token]

  ops_console:
    name: Operations console
    kind: external
    technology: devops-client
    human: true

flows:
  - id: shopper_to_storefront
    from: shopper
    to: storefront
    name: Checkout
    protocol: https
    authentication: session-id
    authorization: end-user-identity
    sends: [card_data, customer_profile]
    receives: [payment_token]

  - id: storefront_to_api
    from: storefront
    to: payment_api
    name: Tokenise
    protocol: https
    authentication: token
    authorization: end-user-identity
    sends: [card_data]
    receives: [payment_token]

  - id: api_to_processor
    from: payment_api
    to: processor
    name: Processor tokenisation
    protocol: https
    authentication: credentials
    authorization: technical-user
    sends: [card_data, processor_credentials]
    receives: [payment_token]

  - id: api_to_token_store
    from: payment_api
    to: token_store
    name: Token persistence
    protocol: sql-access-protocol
    authentication: credentials
    authorization: technical-user
    sends: [payment_token, customer_profile]
    receives: [payment_token, customer_profile]

  - id: api_to_audit
    from: payment_api
    to: audit_store
    name: Audit write
    protocol: sql-access-protocol
    authentication: credentials
    authorization: technical-user
    usage: devops
    sends: [audit_log]

  - id: batch_to_token_store
    from: settlement_batch
    to: token_store
    name: Nightly read
    protocol: sql-access-protocol
    authentication: credentials
    authorization: technical-user
    readonly: true
    receives: [payment_token]

  - id: ops_to_api
    from: ops_console
    to: payment_api
    name: Operator access
    protocol: https
    authentication: token
    authorization: technical-user
    usage: devops
    sends: [customer_profile]

trust_boundaries:
  internet:
    name: Public internet
    type: network-untrusted
    contains: [shopper, ops_console, processor]

  vpc:
    name: Production VPC
    type: network-cloud-provider
    contains: [settlement_batch]
    nested: [web_tier, data_tier]

  web_tier:
    name: Web tier namespace
    type: network-policy-namespace-isolation
    contains: [storefront, payment_api]

  data_tier:
    name: Data tier subnet
    type: network-cloud-security-group
    contains: [token_store, audit_store]

shared_runtimes:
  payments_cluster:
    name: Payments Kubernetes cluster
    runs: [storefront, payment_api, settlement_batch]

assumptions:
  - id: A1
    text: >
      The processor terminates TLS with a pinned certificate and is covered by its
      own attestation, so we do not raise transport findings on that hop.
    suppresses: []

manual_threats:
  - id: T-001
    title: Settlement batch retains card data in temporary files
    element: settlement_batch
    stride: information-disclosure
    severity: high
    description: >
      The batch writes intermediate CSV files to local disk. Nobody has confirmed
      those files are shredded after a run.
    mitigation: Write intermediates to a tmpfs and delete on completion.
    cwe: 459

risk_tracking: {}
