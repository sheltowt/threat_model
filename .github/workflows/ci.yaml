name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      # Actions are pinned to a commit rather than a tag: a tag can be moved, and a
      # threat modelling tool that ignores its own supply chain is not persuasive.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # A stale generated file means someone edited the YAML without regenerating.
      - run: npm run generate:check
      - run: npm run build
      # The committed JSON Schema is what editors fetch by URL; keep it current.
      - run: npm run schema:check
      - run: npm run test

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run coverage

  self-check:
    # The tool analyses its own example model. If tmac cannot run its own example,
    # nothing else in this repository is trustworthy.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node apps/cli/dist/index.js validate examples/payment-service/threatmodel.yaml
      - run: node apps/cli/dist/index.js analyze examples/payment-service/threatmodel.yaml --format all --out tm-out --now 1970-01-01T00:00:00Z
      # The editor must load the example and agree with the CLI about it.
      - run: node apps/cli/dist/index.js serve examples/payment-service/threatmodel.yaml --port 7390 &
      - run: |
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:7390/api/model -o /dev/null && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:7390/ | grep -q 'id="root"'
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: example-report
          path: tm-out/

  container:
    # The image was broken for three merges because nothing ever built it: the data
    # generator was added to the build and `scripts/` was never copied in. It only
    # fails when somebody actually builds it, so now something always does.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1
      - uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355 # v6.10.0
        with:
          context: .
          push: false
          load: true
          tags: tmac:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run the image the way the documentation says to
        run: |
          set -euo pipefail
          # Also proves the non-root image cannot write where it should not.
          mkdir -p work
          cp examples/payment-service/threatmodel.yaml work/
          # As the documentation says to run it. Without --user the non-root image
          # cannot write into a bind mount the host owns, which is a real failure
          # on Linux and invisible on macOS. A function rather than a variable,
          # because relying on an unquoted expansion to word-split is fragile.
          run() { docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/work:/work" tmac:ci "$@"; }
          run validate
          run analyze --format all --out out --quiet
          test -f work/out/risks.sarif
          test -f work/out/report.html
          test -f work/out/data-flow-diagram.svg
          run questions --limit 3
          # The editor is bundled in, so `tmac serve` must work from the image too.
          docker run --rm -d -p 7395:7395 --user "$(id -u):$(id -g)" \
            -v "$PWD/work:/work" --name tmac-serve tmac:ci serve --host 0.0.0.0 --port 7395
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:7395/api/model -o /dev/null && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:7395/ | grep -q 'id="root"'
          docker rm -f tmac-serve

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: github/codeql-action/init@662472033e021d55d94146f66f6058822b0b39fd # v3.27.0
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@662472033e021d55d94146f66f6058822b0b39fd # v3.27.0
