name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and pack, but publish nothing
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run generate:check
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

      # The tag must match what is about to be published. Publishing 0.1.0 from a
      # tag that says v0.2.0 is the kind of mistake nobody notices until later.
      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./apps/cli/package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME does not match package version $pkg" >&2
            exit 1
          fi

      # Prove the published artefact actually works before anything is published.
      - name: Pack, install and run as a user would
        run: |
          set -euo pipefail
          out="$(mktemp -d)"
          for p in packages/core packages/rules packages/render packages/report packages/importers apps/cli; do
            (cd "$p" && npm pack --pack-destination "$out" >/dev/null)
          done
          work="$(mktemp -d)"
          cd "$work"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$out"/*.tgz >/dev/null
          npx tmac init .
          npx tmac validate
          npx tmac analyze --format all --out report --quiet
          test -f report/risks.sarif
          test -f report/report.html
          echo "the packed CLI works from a clean install"

      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: tarballs
          path: '*.tgz'
          if-no-files-found: ignore

  npm:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build

      # Dependencies before dependants, or the registry rejects the CLI for
      # depending on versions that do not exist yet.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          for p in packages/core packages/rules packages/render packages/report packages/importers apps/cli; do
            echo "publishing $p"
            (cd "$p" && npm publish)
          done

  container:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@369eb591f429131d6889c46b94e711f089e6ca96 # v5.6.1
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/tmac
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355 # v6.10.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

  github-release:
    needs: [npm, container]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          generate_release_notes: true
          body: |
            ```bash
            npx tmac init
            npx tmac analyze --format all --fail-on high
            ```

            Or without installing anything:

            ```bash
            docker run --rm -v "$PWD:/work" ghcr.io/${{ github.repository_owner }}/tmac analyze
            ```
